<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="outer-box">
            <input type="text" name="" id="" class="display-box" readonly>
            <div class="keywords">
            <button class="btn" onclick="clearDisplay()">C</button>
            <button class="btn" onclick="one()">1</button>
            <button class="btn" onclick="two()">2</button>
            <button class="btn" onclick="add()">+</button>
            <button class="btn" onclick="three()">3</button>
            <button class="btn" onclick="four()">4</button>
            <button class="btn" onclick="sub()">-</button>
            <button class="btn" onclick="five()">5</button>
            <button class="btn" onclick="six()">6</button>
            <button class="btn" onclick="multiply()">*</button>
            <button class="btn" onclick="seven()">7</button>
            <button class="btn" onclick="eight();">8</button>
            <button class="btn" onclick="devide()">/</button>
            <button class="btn" onclick="equalto()">=</button>
            <button class="btn" onclick="nine()">9</button>
            <button class="btn" onclick="zero()">0</button>
            <button class="btn" onclick="dot()">.</button>
            </div>
        </div>
        </div>
        <script src="script.js"></script>
</body>
</html>
